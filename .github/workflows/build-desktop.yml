name: Build Desktop (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            os: windows-latest
            artifact-name: chofo-windows-msi
            artifact-path: composeApp/build/compose/binaries/main/msi/*.msi
          - target: macOS
            os: macos-latest
            artifact-name: chofo-macos-dmg
            artifact-path: composeApp/build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up WiX Toolset (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install wixtoolset --yes
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $GITHUB_PATH

      - name: Download and bundle libmpv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p composeApp/app-resources/windows
          echo "Resolving latest mpv-dev-x86_64 download..."
          MPV_URL=$(curl -sL https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest \
            | grep "browser_download_url.*mpv-dev-x86_64-[0-9]" \
            | head -n 1 \
            | cut -d '"' -f 4)
          if [ -z "$MPV_URL" ]; then
            MPV_URL="https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z"
          fi
          echo "Downloading $MPV_URL..."
          curl -sL "$MPV_URL" -o mpv-dev.7z
          7z e mpv-dev.7z -ocomposeApp/app-resources/windows/ "libmpv-2.dll" -r -y
          cp composeApp/app-resources/windows/libmpv-2.dll composeApp/app-resources/windows/mpv-2.dll
          rm -f mpv-dev.7z
          echo "Bundled libraries in composeApp/app-resources/windows:"
          ls -lh composeApp/app-resources/windows/

      - name: Configure secrets.properties
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          OPEN_SUBTITLES_API_KEY: ${{ secrets.OPEN_SUBTITLES_API_KEY }}
        run: |
          if [ -f secrets.properties.example ]; then
            cp secrets.properties.example secrets.properties
          fi
          # Inject repository secrets if provided in GitHub Settings -> Secrets
          [ -n "$TMDB_API_KEY" ] && sed -i.bak "s|TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          [ -n "$SUBDL_API_KEY" ] && sed -i.bak "s|SUBDL_API_KEY=.*|SUBDL_API_KEY=$SUBDL_API_KEY|" secrets.properties
          [ -n "$OPEN_SUBTITLES_API_KEY" ] && sed -i.bak "s|OPEN_SUBTITLES_API_KEY=.*|OPEN_SUBTITLES_API_KEY=$OPEN_SUBTITLES_API_KEY|" secrets.properties
          rm -f secrets.properties.bak

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Desktop Distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
